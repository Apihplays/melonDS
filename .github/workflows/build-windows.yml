name: Windows

on:
  push:
    branches:
      - master
      - ci/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
#  MELONDS_VERSION_SUFFIX: " RC"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            image: windows-2025-vs2026
          - name: arm64
            image: windows-11-arm

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.image }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
    - name: Check out sources
      uses: actions/checkout@v6
    - name: Restore vcpkg cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{ matrix.arch.name }}-windows-
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json
    - name: Build
      uses: lukka/run-cmake@v10
      with:
        configurePreset: release-windows-${{ matrix.arch.name }}
        configurePresetAdditionalArgs: "['-DENABLE_DEBUG_DEPS=OFF', '-DMELONDS_EMBED_BUILD_INFO=ON']"
        buildPreset: release-windows-${{ matrix.arch.name }}
    - uses: actions/upload-artifact@v7
      with:
        name: melonDS-windows-${{ matrix.arch.name }}
        path: .\build\release-windows-${{ matrix.arch.name }}\melonDS.exe
    - name: Zip standalone exe (nightly-style)
      shell: pwsh
      run: Compress-Archive -Path .\build\release-windows-${{ matrix.arch.name }}\melonDS.exe -DestinationPath .\melonDS-windows-${{ matrix.arch.name }}.zip -Force
    - name: Upload zip artifact
      uses: actions/upload-artifact@v7
      with:
        name: melonDS-windows-${{ matrix.arch.name }}-zip
        path: .\melonDS-windows-${{ matrix.arch.name }}.zip
    - name: Save vcpkg cache
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles('vcpkg.json') }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download zip artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: melonDS-windows-*-zip
        merge-multiple: true
        path: dist
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
